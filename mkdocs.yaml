site_name: SEDA APIs
site_description: SEDA APIs
site_author: Terradue
site_url: https://terradue.github.io/schemas/
repo_url: https://github.com/Terradue/schemas/
repo_name: Terradue/schemas

theme:
  logo: imgs/icon-eoap.png
  name: readthedocs

  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode

plugins:
- search
- mermaid2:
    version: 11.4.1

markdown_extensions:
- pymdownx.details
- abbr
- admonition
- footnotes
- pymdownx.caret
- pymdownx.mark
- pymdownx.tilde
- pymdownx.arithmatex:
    generic: true
- pymdownx.superfences
- pymdownx.tabbed
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_div_format
- attr_list
- pymdownx.snippets:
    base_path: './'
- pymdownx.highlight:
    line_spans: __span

extra_css:
- styles/css/app.css
  
extra_javascript:
- javascripts/config.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
- Home: index.md
- Events MATE:
  - OpenAPI: c4/class/events-mate/openapi.html

copyright: <a href="https://img.shields.io/badge/license-Apache%202.0-blue?style=flat-square">Apache License, Version 2.0</a>, by <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License, Version 2.0</a>
